name: todo_app
description: A modern todo app with Firebase integration
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  
  # Navigation
  go_router: ^16.0.0
  
  # Notifications
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  permission_handler: ^12.0.1
  
  # Calendar
  table_calendar: ^3.0.9
  
  # UI
  cupertino_icons: ^1.0.2
  
  # Utilities
  equatable: ^2.0.5
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  
  # Drag and Drop (for reordering)
  reorderables: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
